name: Edgewise Autoloop & QA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  autoloop-verification:
    name: Autoloop Hygiene, Full-Stack Unit & E2E Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Test Dependencies
        run: pip install -r backend/requirements.txt

      - name: 1. Neat-Freak Architecture & Doc Sync Check
        run: npm run autoloop:sync

      - name: 2. Autoloop Rules & Pipeline Environment Check (9 Rules)
        run: npm run autoloop:check

      - name: 3. Execute Frontend Unit & E2E Regression Suite
        run: npm test

      - name: 4. Execute Backend Python Unit Test Suite
        run: npm run test:backend

      - name: 5. Empirical Monitor, Daily Derive, Blind Review, Paper Sync & Dataset ETL Checks
        run: |
          npm run autoloop:empirical -- --json
          npm run autoloop:ugc -- --json
          npm run autoloop:derive -- --json
          npm run autoloop:blind -- --json
          npm run autoloop:paper -- --json
          npm run autoloop:dataset -- --json
          npm run autoloop:scripted -- --json
