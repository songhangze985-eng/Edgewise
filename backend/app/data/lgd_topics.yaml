# 谈锋自编 LGD 练习题库（覆盖 5 大经典企业群面母题类型，非企业真题）
topics:
  - id: remote_team
    title: 远程团队协作效率提升方案
    topic_type: open
    material: >
      随着后疫情时代的到来，越来越多的企业采用远程或混合办公模式。然而，远程团队在信息同步、
      任务协同和团队凝聚力方面面临诸多挑战。据调查显示，68% 的远程员工表示在协作效率上存在明显障碍，
      42% 的管理者认为远程团队的产出低于预期。请你们团队讨论如何系统性地提升远程团队的协作效率，
      并给出可落地的解决方案（需包含短期止血动作与中长期考核指标）。

  - id: campus_event
    title: 高校就业季大型双选会组织方案
    topic_type: planning
    material: >
      某高校将在 4 周内举办覆盖 3000 名学生的秋季双选会，涉及 80 家企业、场地协调、安保与宣传。
      资源有限：可用工作人员 12 人、宣传预算 2 万元、主场地仅周末两天全天开放。
      请讨论如何分工组织，确保企业体验、学生参与度和现场秩序，并在讨论结束时形成可执行的方案框架。

  - id: product_priority
    title: 产品功能优先级排序（资源有限）
    topic_type: ranking
    material: >
      某教育 App 下一季度只能投入一个小组（4 人）6 周，候选功能包括：AI 错题本、直播课回放检索、
      家长端周报、社区打卡、支付流程优化。用户调研显示留存与付费转化压力并存，但数据口径尚未统一。
      请小组讨论排序原则，给出前两项优先功能及理由，并说明如何验证选择是否正确。

  - id: budget_cut
    title: 部门预算削减 20% 的应对
    topic_type: dilemma
    material: >
      公司要求你的部门在下季度削减 20% 预算，但不允许裁员。现有支出包括：外部培训、活动经费、
      工具订阅、差旅、临时外包。团队士气近期偏低，若削减不当可能影响关键项目交付。
      请讨论削减原则、可保留与可暂缓项目，以及如何向团队沟通这一决定。

  - id: cross_team_conflict
    title: 跨部门项目延期责任与补救
    topic_type: open
    material: >
      一项跨研发、运营、市场的上线项目已延期两周。研发认为需求变更过多，运营认为市场宣传窗口不可错过，
      市场认为物料迟迟未定稿。客户已询问进度。请小组讨论：如何厘清责任边界、制定未来两周的补救计划，
      以及怎样避免类似冲突再次发生。

  - id: ai_cheat_controversy
    title: 疑似使用 AI 实时提词器的高分候选人录用争议
    topic_type: dilemma
    material: >
      某互联网大厂秋招终面中，一位核心岗位候选人代码与行为面回答极其完美，但面试官复盘录屏发现其每次作答前有固定 2.5 秒停顿且眼球呈水平扫视（「提词器凝视」），怀疑使用了 AI 面试实时提词外挂，但无直接抓拍证据。
      业务部门急需用人主张发放 Offer，HR 合规部门主张一票否决。请小组讨论：1）对该候选人如何定性处理；2）企业如何升级面试流程（如增加深挖追问与群面）以根治 AI 提词作弊。

  - id: polar_survival
    title: 极地科考站突发断联物资 8 选 3 排序
    topic_type: ranking
    material: >
      你们是极地科考先遣队，暴风雪导致基地通讯中断，救援队将在 72 小时后抵达。当前备用雪地车仅能装载 3 件额外物资：
      ① 便携式柴油发电机（含 24 小时燃油） ② 高频卫星信标发射器 ③ 高热量压缩军粮（够 8 人 5 天）
      ④ 医用恒温急救箱 ⑤ 破冰高能炸药包 ⑥ 太阳能折叠充电板 ⑦ 极地防寒羽绒睡袋 ⑧ 纸质地形图与机械指南针。
      请小组确定排序标准，选出必带的 3 件物资并严格排出先后次序。

  - id: ai_product_launch
    title: AI 模拟面试产品校园冷启动增长战役策划
    topic_type: planning
    material: >
      一款主打「脱稿抗追问 + 多智能体群面」的 AI 面试训练平台准备在秋招季开启高校冷启动。
      目标：30 天内获取 10,000 名真实完成首次模拟练习的应届生用户（合格激活），市场推广总预算仅 1.5 万元。
      请小组从「SEO 任务页获客、学长学姐面经裂变、就业办/社团合作、小红书/B站内容种草」中选择核心抓手，制定分周执行计划与漏斗转化指标。

  - id: ev_overseas
    title: 国产新能源车企出海首站：东南亚 vs 欧洲选址博弈
    topic_type: case_debate
    material: >
      某年销 25 万辆的国产新能源汽车品牌计划明年投入 5 亿元建立首个海外直营与组装基地。
      方案 A（东南亚-泰国）：关税友好、中资供应链迁入快、日系车转型慢，但客单价偏低（12–18 万元）、充电基建薄弱；
      方案 B（欧洲-德国/挪威）：品牌溢价高（28–35 万元）、环保补贴成熟，但面临反补贴关税审查、严苛数据合规与本土巨头反扑。
      请小组辩论并达成最终选址决议及首年风险对冲方案。

  - id: monetization_pivot
    title: AI 工具商业化抉择：免费裂变引流 vs 高客单订阅制
    topic_type: case_debate
    material: >
      某垂直领域 AI 生产力工具月活已达 30 万，但算力成本导致每月亏损 40 万元，账面现金仅够维持 8 个月。
      路径一：保持核心功能免费，通过社交分享卡片与邀请解锁获取规模效应，寻求下一轮 VC 融资；
      路径二：立即上线分层会员制（Plus 39元/月、Pro 99元/月）与积分单销包，哪怕承受 35% 免费用户流失也要在 3 个月内实现毛利转正。
      请小组给出明确的商业化决议、定价阶梯设计与老用户安抚方案。
